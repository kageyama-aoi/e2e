name: Update docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Python ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --- Node.js ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: |
          npm ci

      # 生スクリプトパスをここに書かず package.json の npm scripts を呼ぶ。
      # スクリプトが移動しても package.json 側だけ直せばよく、
      # ワークフロー側だけ旧パスが残るドリフトを防ぐ（2026-09-11 に実際発生した不具合の再発防止）。
      - name: Update directory tree
        run: |
          npm run docs:update-readme-map

      - name: Generate JSDoc
        run: |
          npm run docs:jsdoc

      # --- commit & push ---
      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md docs generated || true
          git diff --cached --quiet || git commit -m "chore: update docs"
          git push
